# GoReleaser configuration for SOCKS5 UDP Checker
version: 2

project_name: socks5-udp-checker

builds:
  - id: socks5-udp-checker
    main: ./cmd
    binary: socks5-udp-checker
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser

archives:
  - id: default
    formats:
      - binary
    name_template: >-
      {{ .ProjectName }}-
      {{- .Os }}-
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if eq .Os "windows" }}.exe{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

# GitHub release configuration (auto-detects repository)
release:
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## SOCKS5 UDP & UoT Checker {{.Tag}}

    SOCKS5 UDP & UoT Checker is a cross-platform command-line utility to test SOCKS5 proxy UDP support, UDP-over-TCP (UoT v1/v2), DNS (UDP 53) resolution, ATYP remote domain resolution, and NAT type classification (STUN).

    ### Assets

    Download the pre-compiled executable for your platform:
    - **Linux (amd64)**: `socks5-udp-checker-linux-amd64`
    - **Linux (arm64)**: `socks5-udp-checker-linux-arm64`
    - **macOS (Intel)**: `socks5-udp-checker-darwin-amd64`
    - **macOS (Apple Silicon)**: `socks5-udp-checker-darwin-arm64`
    - **Windows (amd64)**: `socks5-udp-checker-windows-amd64.exe`
    - **Windows (arm64)**: `socks5-udp-checker-windows-arm64.exe`

  footer: |
    ---
    *Built with GoReleaser and GitHub Actions*
